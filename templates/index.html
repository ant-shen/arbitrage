<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Betting Arbitrage Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 2rem;
        }
        .container {
            max-width: 800px;
        }
        .card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">Sports Betting Arbitrage Finder</h1>
        
        <div class="card">
            <div class="card-body">
                <form action="/calculate" method="POST">
                    <div class="mb-3">
                        <label for="sport" class="form-label">Select Sport</label>
                        <select class="form-select" id="sport" name="sport" required>
                            <option value="">Choose a sport...</option>
                            {% for sport in sports %}
                            <option value="{{ sport }}">{{ sport }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="event" class="form-label">Select Event</label>
                        <select class="form-select" id="event" name="event" required disabled>
                            <option value="">Choose an event...</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">Find Arbitrage Opportunities</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#sport').change(function() {
                const sport = $(this).val();
                const eventSelect = $('#event');
                
                if (sport) {
                    $.get(`/get_events/${sport}`, function(events) {
                        eventSelect.empty();
                        eventSelect.append('<option value="">Choose an event...</option>');
                        events.forEach(function(event) {
                            eventSelect.append(`<option value="${event}">${event}</option>`);
                        });
                        eventSelect.prop('disabled', false);
                    });
                } else {
                    eventSelect.empty();
                    eventSelect.append('<option value="">Choose an event...</option>');
                    eventSelect.prop('disabled', true);
                }
            });
        });
    </script>
</body>
</html>
